name: Daily merge custom rules

on:
  schedule:
    # GitHub 的 cron 使用 UTC 时间；01:00 UTC = 北京时间 09:00
    - cron: '0 1 * * *'
  # 支持在 Actions 页面手动触发
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-merge
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download upstream configs & merge custom rules
        run: bash scripts/build.sh

      - name: Generate QR codes (shadowrocket://config/add/...)
        run: |
          python3 -m venv .venv-ci
          .venv-ci/bin/pip install --quiet 'qrcode[pil]'
          .venv-ci/bin/python scripts/gen_qrcodes.py

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [[ -z "$(git status --porcelain -- dist qrcode)" ]]; then
            echo "No changes, skipping commit."
            exit 0
          fi

          git add dist qrcode
          git commit -m "chore(rules): daily merge custom rules [skip ci]"
          # 拉取远端最新提交，避免推送被拒
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Move latest tag to built commit
        run: |
          # 把 latest 标签强制指向远端分支最新 commit（无论本次是否产生新提交），
          # 使产物拥有一个永久固定的访问地址
          SHA="$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | cut -f1)"
          [[ -n "${SHA}" ]] || { echo "ERROR: 无法解析远端 HEAD" >&2; exit 1; }
          git tag -f latest "${SHA}"
          git push -f origin refs/tags/latest
          echo "latest -> ${SHA}"
